<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제조 품질 통합 대시보드 (CPK / PPK / 관리도)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f8f9fa; margin: 0; }
        .container { max-width: 1600px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: flex-end; background: #f1f3f5; padding: 15px; border-radius: 8px; }
        .control-group { display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #495057; }
        input, select { padding: 8px; border: 1px solid #ced4da; border-radius: 4px; min-width: 120px; box-sizing: border-box; }
        input[type="file"] { min-width: 200px; }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-bottom: 25px; }
        .metric-card { background: #e9ecef; padding: 15px; border-radius: 8px; text-align: center; }
        .metric-card.highlight { background: #d0ebff; border: 1px solid #74c0fc; }
        .metric-card h3 { margin: 0 0 8px 0; font-size: 13px; color: #495057; }
        .metric-card p { margin: 0; font-size: 20px; font-weight: bold; color: #212529; }
        
        .chart-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;}
        .chart-box { flex: 1; min-width: 400px; background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 10px; }
        .chart-full { width: 100%; background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 10px; margin-bottom: 20px; box-sizing: border-box; }
        
        .all-categories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 25px; }
        .small-chart-box { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 10px; height: 380px; width: 100%; box-sizing: border-box; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0; color: #343a40;">📊 제조 품질 통합 대시보드 (CPK / PPK / 관리도)</h2>
    
    <div class="controls">
        <div class="control-group">
            <label>1. 엑셀 업로드 (.xlsx)</label>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
        </div>
        <div class="control-group">
            <label>2. 분석 그룹(구분)</label>
            <select id="categorySelect" disabled><option>대기 중...</option></select>
        </div>
        <div class="control-group" id="chartTypeGroup">
            <label>3. 관리도 유형</label>
            <select id="chartTypeSelect">
                <option value="Xbar-R">Xbar-R Chart (부분군)</option>
                <option value="I-MR">I-MR Chart (개별값)</option>
            </select>
        </div>
        <div class="control-group">
            <label>LSL (하한규격)</label>
            <input type="number" id="lsl" step="0.001" value="20.9">
        </div>
        <div class="control-group">
            <label>USL (상한규격)</label>
            <input type="number" id="usl" step="0.001" value="21.0">
        </div>
        <div class="control-group" id="subgroupSizeGroup">
            <label>부분군 크기 (n)</label>
            <input type="number" id="subgroupSize" min="2" max="10" value="5">
        </div>
    </div>

    <!-- 단일 구분 분석 뷰 -->
    <div id="singleCategoryView">
        <div class="metrics-grid">
            <div class="metric-card"><h3>전체 평균 (Mean)</h3><p id="txt-mean">-</p></div>
            <div class="metric-card"><h3>전체 표준편차 (LT)</h3><p id="txt-std-lt">-</p></div>
            <div class="metric-card highlight"><h3>Pp (장기)</h3><p id="txt-pp">-</p></div>
            <div class="metric-card highlight"><h3>Ppk (장기)</h3><p id="txt-ppk">-</p></div>
            <div class="metric-card highlight"><h3>Cp (단기)</h3><p id="txt-cp">-</p></div>
            <div class="metric-card highlight"><h3>Cpk (단기)</h3><p id="txt-cpk">-</p></div>
        </div>

        <div class="chart-row">
            <div class="chart-box" id="chartHist" style="height: 450px;"></div>
            <div class="chart-box" id="chartBox" style="height: 450px;"></div>
        </div>
        
        <div id="controlChartsArea">
            <div class="chart-full" id="chartTop" style="height: 400px;"></div>
            <div class="chart-full" id="chartBottom" style="height: 400px;"></div>
        </div>
    </div>

    <!-- 전체 구분 비교 뷰 -->
    <div id="allCategoriesView" class="hidden">
        <h3 style="border-bottom: 2px solid #dee2e6; padding-bottom: 10px; margin-bottom:20px;">[전체 구분] 공정능력 히스토그램 요약</h3>
        <div class="all-categories-grid" id="allChartsGrid"></div>
    </div>
</div>

<script>
    let globalCategories = {}; 
    let renderTimer = null; // 렌더링 딜레이를 위한 타이머

    const controlConstants = {
        2: { d2: 1.128, A2: 1.880, D3: 0, D4: 3.267, E2: 2.660 },
        3: { d2: 1.693, A2: 1.023, D3: 0, D4: 2.574 },
        4: { d2: 2.059, A2: 0.729, D3: 0, D4: 2.282 },
        5: { d2: 2.326, A2: 0.577, D3: 0, D4: 2.114 },
        6: { d2: 2.534, A2: 0.483, D3: 0, D4: 2.004 },
        7: { d2: 2.704, A2: 0.419, D3: 0.076, D4: 1.924 },
        8: { d2: 2.847, A2: 0.373, D3: 0.136, D4: 1.864 },
        9: { d2: 2.970, A2: 0.337, D3: 0.184, D4: 1.816 },
        10: { d2: 3.078, A2: 0.308, D3: 0.223, D4: 1.777 }
    };

    const commonMargin = { t: 50, b: 50, l: 80, r: 50 };

    // --- 1. 엑셀 파일 읽기 및 데이터 파싱 ---
    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            
            const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});
            globalCategories = {}; 

            const maxCols = rows[0] ? rows[0].length : 0;
            
            for (let col = 0; col < maxCols; col += 2) {
                let currentCategory = null;
                let currentUSL = null;
                let currentLSL = null;
                let currentData = [];

                for (let row = 1; row < rows.length; row++) {
                    if (!rows[row]) continue;

                    let catCell = rows[row][col];
                    let valCell = rows[row][col + 1];

                    let catStr = (catCell !== undefined && catCell !== null) ? String(catCell).trim() : '';
                    let catStrUpper = catStr.toUpperCase();
                    let valNum = parseFloat(valCell);

                    if (catStrUpper === 'USL' || catStrUpper === '상한' || catStrUpper === '상한규격') {
                        if (!isNaN(valNum)) currentUSL = valNum;
                        continue;
                    }
                    if (catStrUpper === 'LSL' || catStrUpper === '하한' || catStrUpper === '하한규격') {
                        if (!isNaN(valNum)) currentLSL = valNum;
                        continue;
                    }

                    if (catStr !== '') {
                        if (currentCategory && currentData.length > 0) {
                            if (!globalCategories[currentCategory]) {
                                globalCategories[currentCategory] = { data: [], usl: currentUSL, lsl: currentLSL };
                            } else {
                                if (currentUSL !== null) globalCategories[currentCategory].usl = currentUSL;
                                if (currentLSL !== null) globalCategories[currentCategory].lsl = currentLSL;
                            }
                            globalCategories[currentCategory].data.push(...currentData);
                            currentData = []; 
                        }
                        currentCategory = catStr;
                    }

                    if (currentCategory && !isNaN(valNum)) {
                        currentData.push(valNum);
                    }
                }

                if (currentCategory && currentData.length > 0) {
                    if (!globalCategories[currentCategory]) {
                        globalCategories[currentCategory] = { data: [], usl: currentUSL, lsl: currentLSL };
                    } else {
                        if (currentUSL !== null) globalCategories[currentCategory].usl = currentUSL;
                        if (currentLSL !== null) globalCategories[currentCategory].lsl = currentLSL;
                    }
                    globalCategories[currentCategory].data.push(...currentData);
                }
            }
            updateCategoryDropdown();
        };
        reader.readAsArrayBuffer(file);
    });

    // --- 2. 이벤트 리스너 ---
    function updateCategoryDropdown() {
        const select = document.getElementById('categorySelect');
        select.innerHTML = '<option value="ALL">전체 구분 모아보기 (All)</option>'; 
        
        const categories = Object.keys(globalCategories);
        categories.forEach(cat => {
            select.appendChild(new Option(cat, cat));
        });
        select.disabled = false;
        
        if(categories.length > 0) {
             select.value = categories[0];
             if (globalCategories[categories[0]].usl !== null) document.getElementById('usl').value = globalCategories[categories[0]].usl;
             if (globalCategories[categories[0]].lsl !== null) document.getElementById('lsl').value = globalCategories[categories[0]].lsl;
        }
        updateDashboard();
    }

    document.getElementById('categorySelect').addEventListener('change', function(e) {
        const selected = e.target.value;
        if (selected !== "ALL" && globalCategories[selected]) {
            if (globalCategories[selected].usl !== null) document.getElementById('usl').value = globalCategories[selected].usl;
            if (globalCategories[selected].lsl !== null) document.getElementById('lsl').value = globalCategories[selected].lsl;
        }
        updateDashboard();
    });

    document.getElementById('lsl').addEventListener('input', function(e) {
        const selected = document.getElementById('categorySelect').value;
        const val = parseFloat(e.target.value);
        if (selected !== "ALL" && globalCategories[selected] && !isNaN(val)) globalCategories[selected].lsl = val; 
        updateDashboard();
    });

    document.getElementById('usl').addEventListener('input', function(e) {
        const selected = document.getElementById('categorySelect').value;
        const val = parseFloat(e.target.value);
        if (selected !== "ALL" && globalCategories[selected] && !isNaN(val)) globalCategories[selected].usl = val; 
        updateDashboard();
    });

    document.getElementById('chartTypeSelect').addEventListener('change', updateDashboard);
    document.getElementById('subgroupSize').addEventListener('change', updateDashboard);

    // --- 3. 대시보드 UI 전환 및 렌더링 호출 ---
    function updateDashboard() {
        if (Object.keys(globalCategories).length === 0) return;

        const selectedCategory = document.getElementById('categorySelect').value;
        const chartType = document.getElementById('chartTypeSelect').value;
        
        const LSL = parseFloat(document.getElementById('lsl').value);
        const USL = parseFloat(document.getElementById('usl').value);
        
        // 화면 전환 로직
        if (selectedCategory === "ALL") {
            document.getElementById('singleCategoryView').classList.add('hidden');
            document.getElementById('allCategoriesView').classList.remove('hidden');
            document.getElementById('chartTypeGroup').classList.add('hidden');
            document.getElementById('subgroupSizeGroup').classList.add('hidden');
        } else {
            document.getElementById('singleCategoryView').classList.remove('hidden');
            document.getElementById('allCategoriesView').classList.add('hidden');
            document.getElementById('chartTypeGroup').classList.remove('hidden');
            if(chartType === 'Xbar-R') {
                document.getElementById('subgroupSizeGroup').classList.remove('hidden');
            } else {
                document.getElementById('subgroupSizeGroup').classList.add('hidden');
            }
        }

        // 🔥 [해결의 핵심] 브라우저가 숨겨진 화면을 다 펼칠 때까지 0.1초 기다렸다가 차트를 그립니다.
        if (renderTimer) clearTimeout(renderTimer);
        renderTimer = setTimeout(() => {
            if (selectedCategory === "ALL") {
                drawAllCategories(LSL, USL);
            } else {
                renderSingleCategory(selectedCategory, chartType, LSL, USL);
            }
        }, 100); 
    }

    // --- 4. 개별 차트 렌더링 함수 ---
    function renderSingleCategory(selectedCategory, chartType, LSL, USL) {
        const values = globalCategories[selectedCategory].data;
        if (values.length < 2) { alert(`데이터가 부족합니다.`); return; }

        let specRange = Math.abs(USL - LSL);
        if (specRange === 0 || isNaN(specRange)) specRange = 1;

        const mean = values.reduce((a, b) => a + b, 0) / values.length;
        const sumSq = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0);
        let stdLT = Math.sqrt(sumSq / (values.length - 1));
        
        if (stdLT === 0 || isNaN(stdLT)) stdLT = specRange * 0.05; 

        const pp = (USL - LSL) / (6 * stdLT);
        const ppu = (USL - mean) / (3 * stdLT);
        const ppl = (mean - LSL) / (3 * stdLT);
        const ppk = Math.min(ppu, ppl);

        let stdST = stdLT; 
        let cp = 0, cpk = 0;

        Plotly.purge('chartTop');
        Plotly.purge('chartBottom');

        if (chartType === 'Xbar-R') {
            let n = parseInt(document.getElementById('subgroupSize').value);
            if (n < 2) n = 2; if (n > 10) n = 10;
            if (values.length < n) return;

            const subgroups = [], xbars = [], ranges = [];
            for (let i = 0; i <= values.length - n; i += n) {
                const chunk = values.slice(i, i + n);
                subgroups.push(chunk);
                xbars.push(chunk.reduce((a,b)=>a+b,0) / n);
                ranges.push(Math.max(...chunk) - Math.min(...chunk));
            }

            const grandMean = xbars.reduce((a,b)=>a+b,0) / xbars.length;
            let rBar = ranges.reduce((a,b)=>a+b,0) / ranges.length;
            if (rBar === 0 || isNaN(rBar)) rBar = specRange * 0.05; 

            const { d2, A2, D3, D4 } = controlConstants[n];
            
            stdST = rBar / d2;
            cp = (USL - LSL) / (6 * stdST);
            cpk = Math.min((USL - grandMean) / (3 * stdST), (grandMean - LSL) / (3 * stdST));

            drawXbarChart('chartTop', xbars, grandMean, rBar, A2, selectedCategory);
            drawRChart('chartBottom', ranges, rBar, D3, D4, selectedCategory);

        } else if (chartType === 'I-MR') {
            const n = 2;
            const individuals = values;
            const movingRanges = [];
            for (let i = 1; i < values.length; i++) {
                movingRanges.push(Math.abs(values[i] - values[i-1]));
            }

            const grandMean = individuals.reduce((a,b)=>a+b,0) / individuals.length;
            let mrBar = movingRanges.reduce((a,b)=>a+b,0) / movingRanges.length;
            if (mrBar === 0 || isNaN(mrBar)) mrBar = specRange * 0.05; 

            const { d2, E2, D3, D4 } = controlConstants[n]; 

            stdST = mrBar / d2;
            cp = (USL - LSL) / (6 * stdST);
            cpk = Math.min((USL - grandMean) / (3 * stdST), (grandMean - LSL) / (3 * stdST));

            drawIChart('chartTop', individuals, grandMean, mrBar, E2, selectedCategory);
            drawMRChart('chartBottom', movingRanges, mrBar, D3, D4, selectedCategory);
        }

        document.getElementById('txt-mean').textContent = mean.toFixed(4);
        document.getElementById('txt-std-lt').textContent = stdLT.toFixed(4);
        document.getElementById('txt-pp').textContent = pp.toFixed(3);
        document.getElementById('txt-ppk').textContent = ppk.toFixed(3);
        document.getElementById('txt-cp').textContent = cp.toFixed(3);
        document.getElementById('txt-cpk').textContent = cpk.toFixed(3);

        drawHistogram('chartHist', values, mean, stdLT, LSL, USL, selectedCategory);
        drawBoxPlot('chartBox', values, selectedCategory);
    }

    function drawHistogram(divId, values, mean, std, LSL, USL, category) {
        let specRange = Math.abs(USL - LSL);
        if (specRange === 0 || isNaN(specRange)) specRange = 1;
        const binSize = specRange / 25; 

        // 🔥 X축 스케일 고정을 위한 최솟값 최댓값 강제 지정
        let dataMin = values.reduce((min, v) => v < min ? v : min, values[0]);
        let dataMax = values.reduce((max, v) => v > max ? v : max, values[0]);
        const minVal = Math.min(dataMin, LSL) - (std * 2);
        const maxVal = Math.max(dataMax, USL) + (std * 2);
        
        const xCurve = [], yCurve = [];
        const step = (maxVal - minVal) / 100;
        for (let x = minVal; x <= maxVal; x += step) {
            xCurve.push(x);
            yCurve.push((1 / (std * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x - mean) / std, 2)));
        }

        const layout = {
            title: `<b>[${category}] 공정능력 히스토그램</b>`,
            margin: commonMargin, 
            showlegend: false,
            xaxis: { 
                tickformat: '.3f',
                range: [minVal, maxVal] // X축이 엉뚱한 곳을 보여주는 버그 완벽 차단
            }, 
            shapes: [
                { type: 'line', x0: LSL, x1: LSL, y0: 0, y1: 1, yref: 'paper', line: { color: 'red', dash: 'dash', width: 2 } },
                { type: 'line', x0: USL, x1: USL, y0: 0, y1: 1, yref: 'paper', line: { color: 'red', dash: 'dash', width: 2 } }
            ],
            annotations: [
                { x: LSL, y: 1, yref: 'paper', text: `LSL`, showarrow: false, yanchor: 'bottom', font: {color: 'red', size:10} },
                { x: USL, y: 1, yref: 'paper', text: `USL`, showarrow: false, yanchor: 'bottom', font: {color: 'red', size:10} }
            ]
        };
        Plotly.newPlot(divId, [
            { x: values, type: 'histogram', histnorm: 'probability density', xbins: { size: binSize }, marker: { color: '#4dabf7', line: {color: 'white', width:1} }, opacity: 0.7 },
            { x: xCurve, y: yCurve, type: 'scatter', mode: 'lines', line: { color: '#343a40', width: 2 } }
        ], layout, {responsive: true});
    }

    function drawBoxPlot(divId, values, category) {
        Plotly.newPlot(divId, [{
            y: values, type: 'box', name: category, boxpoints: 'all', jitter: 0.3, pointpos: -1.8, marker: { color: '#3bc9db' }
        }], { 
            title: `<b>[${category}] Box Plot (데이터 산포)</b>`, 
            margin: commonMargin,
            yaxis: { tickformat: '.3f' } 
        }, {responsive: true});
    }

    function drawXbarChart(divId, xbars, grandMean, rBar, A2, category) {
        const ucl = grandMean + (A2 * rBar);
        const lcl = grandMean - (A2 * rBar);
        const xLen = xbars.map((_, i) => i + 1);

        const layout = {
            title: `<b>[${category}] Xbar Chart (부분군 평균)</b>`,
            margin: { t: 50, b: 50, l: 80, r: 80 }, 
            yaxis: { tickformat: '.3f' }, 
            shapes: [
                { type: 'line', x0: 1, x1: xbars.length, y0: ucl, y1: ucl, line: { color: 'red', width: 2 } },
                { type: 'line', x0: 1, x1: xbars.length, y0: lcl, y1: lcl, line: { color: 'red', width: 2 } },
                { type: 'line', x0: 1, x1: xbars.length, y0: grandMean, y1: grandMean, line: { color: 'green', width: 2 } }
            ],
            annotations: [
                { x: xbars.length, y: ucl, text: `UCL=${ucl.toFixed(3)}`, showarrow: false, xanchor: 'left', font: {size: 11} },
                { x: xbars.length, y: lcl, text: `LCL=${lcl.toFixed(3)}`, showarrow: false, xanchor: 'left', font: {size: 11} },
                { x: xbars.length, y: grandMean, text: `CL=${grandMean.toFixed(3)}`, showarrow: false, xanchor: 'left', font: {size: 11} }
            ]
        };
        Plotly.newPlot(divId, [{ x: xLen, y: xbars, type: 'scatter', mode: 'lines+markers', line: {color: '#228be6'} }], layout, {responsive: true});
    }

    function drawRChart(divId, ranges, rBar, D3, D4, category) {
        const ucl = D4 * rBar;
        const lcl = D3 * rBar;
        const xLen = ranges.map((_, i) => i + 1);

        const layout = {
            title: `<b>[${category}] R Chart (부분군 산포)</b>`,
            margin: { t: 50, b: 50, l: 80, r: 80 },
            yaxis: { tickformat: '.4f' },
            shapes: [
                { type: 'line', x0: 1, x1: ranges.length, y0: ucl, y1: ucl, line: { color: 'red', width: 2 } },
                { type: 'line', x0: 1, x1: ranges.length, y0: lcl, y1: lcl, line: { color: 'red', width: 2 } },
                { type: 'line', x0: 1, x1: ranges.length, y0: rBar, y1: rBar, line: { color: 'green', width: 2 } }
            ],
            annotations: [
                { x: ranges.length, y: ucl, text: `UCL=${ucl.toFixed(4)}`, showarrow: false, xanchor: 'left', font: {size: 11} },
                { x: ranges.length, y: lcl, text: `LCL=${lcl.toFixed(4)}`, showarrow: false, xanchor: 'left', font: {size: 11} },
                { x: ranges.length, y: rBar, text: `CL=${rBar.toFixed(4)}`, showarrow: false, xanchor: 'left', font: {size: 11} }
            ]
        };
        Plotly.newPlot(divId, [{ x: xLen, y: ranges, type: 'scatter', mode: 'lines+markers', line: {color: '#fd7e14'} }], layout, {responsive: true});
    }

    function drawIChart(divId, individuals, grandMean, mrBar, E2, category) {
        const ucl = grandMean + (E2 * mrBar);
        const lcl = grandMean - (E2 * mrBar);
        const xLen = individuals.map((_, i) => i + 1);

        const layout = {
            title: `<b>[${category}] I Chart (개별값 관리)</b>`,
            margin: { t: 50, b: 50, l: 80, r: 80 },
            yaxis: { tickformat: '.3f' },
            shapes: [
                { type: 'line', x0: 1, x1: individuals.length, y0: ucl, y1: ucl, line: { color: 'red', width: 2 } },
                { type: 'line', x0: 1, x1: individuals.length, y0: lcl, y1: lcl, line: { color: 'red', width: 2 } },
                { type: 'line', x0: 1, x1: individuals.length, y0: grandMean, y1: grandMean, line: { color: 'green', width: 2 } }
            ],
            annotations: [
                { x: individuals.length, y: ucl, text: `UCL=${ucl.toFixed(3)}`, showarrow: false, xanchor: 'left', font: {size: 11} },
                { x: individuals.length, y: lcl, text: `LCL=${lcl.toFixed(3)}`, showarrow: false, xanchor: 'left', font: {size: 11} },
                { x: individuals.length, y: grandMean, text: `CL=${grandMean.toFixed(3)}`, showarrow: false, xanchor: 'left', font: {size: 11} }
            ]
        };
        Plotly.newPlot(divId, [{ x: xLen, y: individuals, type: 'scatter', mode: 'lines+markers', line: {color: '#845ef7'} }], layout, {responsive: true});
    }

    function drawMRChart(divId, movingRanges, mrBar, D3, D4, category) {
        const ucl = D4 * mrBar;
        const lcl = D3 * mrBar;
        const xLen = movingRanges.map((_, i) => i + 2); 

        const layout = {
            title: `<b>[${category}] MR Chart (이동범위 관리)</b>`,
            margin: { t: 50, b: 50, l: 80, r: 80 },
            yaxis: { tickformat: '.4f' },
            xaxis: { tick0: 1, dtick: 1 }, 
            shapes: [
                { type: 'line', x0: 2, x1: xLen[xLen.length-1], y0: ucl, y1: ucl, line: { color: 'red', width: 2 } },
                { type: 'line', x0: 2, x1: xLen[xLen.length-1], y0: mrBar, y1: mrBar, line: { color: 'green', width: 2 } }
            ],
            annotations: [
                { x: xLen[xLen.length-1], y: ucl, text: `UCL=${ucl.toFixed(4)}`, showarrow: false, xanchor: 'left', font: {size: 11} },
                { x: xLen[xLen.length-1], y: mrBar, text: `CL=${mrBar.toFixed(4)}`, showarrow: false, xanchor: 'left', font: {size: 11} }
            ]
        };
        
        if(lcl > 0) {
            layout.shapes.push({ type: 'line', x0: 2, x1: xLen[xLen.length-1], y0: lcl, y1: lcl, line: { color: 'red', width: 2 } });
            layout.annotations.push({ x: xLen[xLen.length-1], y: lcl, text: `LCL=${lcl.toFixed(4)}`, showarrow: false, xanchor: 'left', font: {size: 11} });
        }
        Plotly.newPlot(divId, [{ x: xLen, y: movingRanges, type: 'scatter', mode: 'lines+markers', line: {color: '#fcc419'} }], layout, {responsive: true});
    }

    // --- 5. 전체 구분 모아보기 ---
    function drawAllCategories(defaultLSL, defaultUSL) {
        const grid = document.getElementById('allChartsGrid');
        grid.innerHTML = ''; 

        const categories = Object.keys(globalCategories);
        
        categories.forEach((cat, index) => {
            const catData = globalCategories[cat];
            const values = catData.data;
            if(values.length < 2) return;

            let LSL = (catData.lsl !== null && !isNaN(catData.lsl)) ? catData.lsl : defaultLSL;
            let USL = (catData.usl !== null && !isNaN(catData.usl)) ? catData.usl : defaultUSL;

            let specRange = Math.abs(USL - LSL);
            if (specRange === 0 || isNaN(specRange)) specRange = 1;
            const binSize = specRange / 25; 

            const mean = values.reduce((a, b) => a + b, 0) / values.length;
            const sumSq = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0);
            let std = Math.sqrt(sumSq / (values.length - 1));
            if (std === 0 || isNaN(std)) std = specRange * 0.05;
            
            const ppu = (USL - mean) / (3 * std);
            const ppl = (mean - LSL) / (3 * std);
            const ppk = Math.min(ppu, ppl);

            const divId = `allChart_${index}`;
            const wrapDiv = document.createElement('div');
            wrapDiv.className = 'small-chart-box';
            wrapDiv.id = divId;
            grid.appendChild(wrapDiv);

            const title = `<b>[${cat}]</b><br><span style="font-size:12px">Mean: ${mean.toFixed(3)} | Ppk: ${ppk.toFixed(3)}</span>`;

            // 🔥 X축 스케일 고정을 위한 최솟값 최댓값 강제 지정
            let dataMin = values.reduce((min, v) => v < min ? v : min, values[0]);
            let dataMax = values.reduce((max, v) => v > max ? v : max, values[0]);
            const minVal = Math.min(dataMin, LSL) - (std * 2);
            const maxVal = Math.max(dataMax, USL) + (std * 2);

            const xCurve = [], yCurve = [];
            const step = (maxVal - minVal) / 100;
            
            for (let x = minVal; x <= maxVal; x += step) {
                xCurve.push(x);
                yCurve.push((1 / (std * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x - mean) / std, 2)));
            }

            const layout = {
                title: title,
                margin: { t: 75, b: 40, l: 50, r: 30 }, 
                showlegend: false,
                xaxis: { 
                    tickformat: '.3f',
                    range: [minVal, maxVal] // X축 고정
                },
                shapes: [
                    { type: 'line', x0: LSL, x1: LSL, y0: 0, y1: 1, yref: 'paper', line: { color: 'red', dash: 'dash', width: 1.5 } },
                    { type: 'line', x0: USL, x1: USL, y0: 0, y1: 1, yref: 'paper', line: { color: 'red', dash: 'dash', width: 1.5 } }
                ]
            };
            
            Plotly.newPlot(divId, [
                { x: values, type: 'histogram', histnorm: 'probability density', xbins: { size: binSize }, marker: { color: '#4dabf7', line: {color: 'white', width:1} }, opacity: 0.7 },
                { x: xCurve, y: yCurve, type: 'scatter', mode: 'lines', line: { color: '#343a40', width: 1.5 } }
            ], layout, { responsive: true, displayModeBar: false });
        });
    }
</script>
