name: Deploy CPK Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 1. Secrets에 저장된 API 키를 불러와서 HTML 내부의 임시 텍스트를 실제 키로 치환합니다.
      - name: Inject Gemini API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          sed -i "s/GITHUB_SECRET_GEMINI_API_KEY/${GEMINI_API_KEY}/g" index.html

      # 2. 키가 치환된 최종 결과물만 gh-pages 브랜치로 배포합니다.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
